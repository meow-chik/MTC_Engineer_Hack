name: validate

on:
  push:
  pull_request:

jobs:
  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate Kubernetes manifests
        uses: docker://ghcr.io/yannh/kubeconform:v0.7.0
        with:
          entrypoint: /kubeconform
          args: >-
            -strict -ignore-missing-schemas -summary
            k8s/app/app.yaml k8s/gateway/gateway.yaml
            k8s/monitoring/monitoring.yaml k8s/logging/logging.yaml
      - name: Shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './scripts'
