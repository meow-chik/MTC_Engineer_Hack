<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<style>text{font-family:Arial,sans-serif;fill:#111}.box{fill:#f7f7f7;stroke:#222;stroke-width:2}.arrow{stroke:#222;stroke-width:2;marker-end:url(#a)}.small{font-size:16px}.title{font-size:26px;font-weight:bold}.label{font-size:19px;font-weight:bold}</style>
